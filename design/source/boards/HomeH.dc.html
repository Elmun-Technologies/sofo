<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home H — Answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBFBF9}
a{color:#16161A;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #FBFBF9; color: #16161A; font-family: 'Inter', system-ui, sans-serif">
<header style="max-width: 1100px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<a href="#" style="font-size: 20px; font-weight: 700">[BRAND]</a>
<span style="flex-grow: 1"></span>
<a href="#" style="padding: 12px 8px; font-size: 14px; color: #55555E">Browse</a>
<a href="#" style="padding: 12px 8px; font-size: 14px; color: #55555E">Languages</a>
<button type="button" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #DADAD4; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #16161A">English ▾</button>
</header>

<main style="max-width: 1100px; margin: 0 auto; padding: 56px 32px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<form role="search" style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; font-family: 'Source Serif 4', serif; font-size: 46px; line-height: 1.25; font-weight: 500">
<span>Where can I watch</span>
<label for="t" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Title</label>
<input id="t" value="Inside Out 2" style="width: 300px; border: 0; border-bottom: 3px solid #16161A; background: #FDE047; padding: 0 10px; font-family: inherit; font-size: inherit; font-weight: 700; color: #16161A">
<span>in</span>
<label for="l" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Language</label>
<input id="l" value="Turkish" style="width: 190px; border: 0; border-bottom: 3px solid #16161A; background: #FDE047; padding: 0 10px; font-family: inherit; font-size: inherit; font-weight: 700; color: #16161A">
<span>?</span>
<button type="submit" style="height: 56px; padding: 0 26px; border: 0; border-radius: 999px; background: #16161A; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; align-self: center">Ask</button>
</form>

<section style="display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E7E1; box-shadow: 0 18px 40px rgba(22,22,26,0.06)">
<img src="/_blob/79f8fee8ed49eaf30382120f6b21d16f" alt="Inside Out 2 poster" style="width: 150px; height: 225px; object-fit: cover; border-radius: 12px">
<div style="flex: 999 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; color: #55555E">Answer for Türkiye · checked today 09:40</span>
<p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 32px; line-height: 1.25; font-weight: 700">Yes — on <span style="background: #FDE047; padding: 0 6px">Disney+</span>, with Turkish audio and subtitles.</p>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #EFEFE9">
<img src="{{o.logo}}" alt="" style="width: 36px; height: 36px; border-radius: 8px">
<span style="flex: 999 1 200px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{o.n}}</span><span style="font-size: 14px; color: #55555E">{{o.d}}</span></span>
<a href="#" style="{{o.cta}}">{{o.c}}</a>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 10px; font-family: 'Source Serif 4', serif; font-size: 28px; font-weight: 700">People also ask</h2>
<sc-for list="{{faq}}" as="f" hint-placeholder-count="4">
<details style="border-top: 1px solid #E7E7E1; padding: 0 4px">
<summary style="padding: 18px 0; font-size: 17px; font-weight: 600; cursor: pointer">{{f.q}}</summary>
<p style="margin: 0 0 18px; font-size: 16px; line-height: 1.6; color: #3D3D45">{{f.a}}</p>
</details>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 28px; font-weight: 700">Most asked this week</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{asked}}" as="a" hint-placeholder-count="8"><a href="#" style="padding: 12px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E7E7E1; font-size: 15px">{{a}}</a></sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const b = (id) => '/_blob/' + id;
const dark = 'height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; background: #16161A; color: #FFFFFF; font-size: 14px; font-weight: 700';
const light = 'height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #DADAD4; font-size: 14px; font-weight: 600';
return {
opts: [
{ n: 'Disney+', d: 'Subscription · Turkish audio ✓ · Turkish subtitles ✓', logo: b('73cc46ffcd16b9ca2ab5420acf984a61'), c: 'Watch on Disney+ ↗', cta: dark },
{ n: 'Prime Video', d: 'Rent ₺79 · Turkish subtitles only', logo: b('996ff9952cc48dec9ccd2e076c38e147'), c: 'Rent ↗', cta: light },
{ n: 'Netflix', d: 'Not available in Türkiye', logo: b('d2df8e6b31dc8a17d738cdcbe082abae'), c: 'Get notified', cta: light }
],
faq: [
{ q: 'Is Inside Out 2 free to watch anywhere in Türkiye?', a: 'Not right now. It is included in a Disney+ subscription and can be rented on Prime Video.' },
{ q: 'Who voices Joy in the Turkish dub?', a: 'Turkish dub cast details appear on the title page when the service publishes them.' },
{ q: 'Is the first Inside Out also dubbed in Turkish?', a: 'Yes, on Disney+ in Türkiye.' },
{ q: 'Can I watch it in English with Turkish subtitles?', a: 'Yes — Disney+ and Prime Video both offer Turkish subtitles.' }
],
asked: ['Arcane in Spanish', 'Demon Slayer German dub', 'The Wild Robot Turkish', 'Moana 2 in Arabic', 'Spirited Away English dub', 'Coco in Portuguese', 'Is Kung Fu Panda 4 on Netflix?', 'Free anime with dub']
};
}
}
</script>
</body>
</html>
