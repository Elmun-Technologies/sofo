# Ingest (manual). ADR 0002: the database is Cloudflare D1, which GitHub Actions cannot reach without
# Cloudflare credentials — the daily schedule is disabled until a protected in-Worker ingest endpoint exists.
# This job only validates that the ingest scripts run (dry-run against an ephemeral local D1).
# Secrets: TMDB_API_KEY, STREAMING_AVAILABILITY_API_KEY (GitHub Actions secrets only).
name: ingest

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "metadata | availability | both"
        default: "availability"
      limit:
        description: "Max titles (empty = all)"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local D1 (ephemeral)
        run: pnpm db:migrate

      - name: Metadata (TMDB)
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'metadata' || inputs.stage == 'both')
        run: pnpm ingest:metadata --dry-run ${{ inputs.limit != '' && format('--limit={0}', inputs.limit) || '' }}

      - name: Availability (Streaming Availability)
        if: inputs.stage == 'availability' || inputs.stage == 'both'
        run: pnpm ingest:availability --dry-run ${{ inputs.limit != '' && format('--limit={0}', inputs.limit) || '' }}
