# Local Postgres for development. Usage: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sofo
      POSTGRES_PASSWORD: sofo
      POSTGRES_DB: sofo
    ports:
      - "5432:5432"
    volumes:
      - sofo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofo -d sofo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sofo-db:
